name: CI
on:
  pull_request:
  push:
    branches: [main, develop, abner]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.6
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: fiap_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U ci -d fiap_ci'
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      FIAP_DB_USER: ci
      FIAP_DB_PASSWORD: ci
      FIAP_DB_HOST: localhost
      FIAP_DB_PORT: '5432'
      FIAP_DB_NAME: fiap_ci
      PGSSLMODE: disable
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check app/api etl tests scripts cloud airflow/dags
      - run: python -m scripts.migrate
      - run: python -m scripts.seed_ci
      - run: python -m pytest -m 'not banco_real'
      - run: dbt test --project-dir dbt --profiles-dir dbt
      - run: dbt docs generate --project-dir dbt --profiles-dir dbt
      - uses: actions/upload-artifact@v4
        with:
          name: dbt-docs
          path: dbt/target/
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
